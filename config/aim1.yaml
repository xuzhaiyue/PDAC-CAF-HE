# Aim 1 — whether nuclear morphology carries molecular information beyond the surrounding tissue (Visium HD, 4 untreated PDAC patients)
# Rule: the analysis section of this file is fixed before modelling (scripts/07); 07 writes the hash of this file into its results.

paths:
  spaceranger_root: /Users/Zhaiyue/VISIUMHDdata
  he_dir: null               # directory of the original H&E images (read in place, not copied); absolute paths can also be given in samples
  work_dir: /Users/Zhaiyue/PDAC_HE_Morphotype/results
  gene_programs: /Users/Zhaiyue/PDAC_HE_Morphotype/config/gene_programs.yaml
  uni2h_weights: null        # local UNI2-h weights (.bin/.pth); null pulls from the HF hub (access required)

# A1/D1 etc. are capture-area IDs; the grouping unit is patient_id
# he_image: full-resolution H&E, read from the Loupe file (spaceranger embeds the --image original as lossless PNG tiles in
# segmented_outputs/cloupe.cloupe; checked 2026-10-14: dimensions identical to spaceranger, r >= 0.99 against the hires thumbnail).
# Can be replaced by the original image path (relative to he_dir, or absolute); it must be the file used for spaceranger --image.
samples:
  - {sample_id: A1, patient_id: HD6832, outs: HDA1_count/outs, he_image: /Users/Zhaiyue/VISIUMHDdata/HDA1_count/outs/segmented_outputs/cloupe.cloupe}
  - {sample_id: D1, patient_id: HD8130, outs: HDD1_count/outs, he_image: /Users/Zhaiyue/VISIUMHDdata/HDD1_count/outs/segmented_outputs/cloupe.cloupe}
  - {sample_id: A2, patient_id: HD7821, outs: HDA2_count/outs, he_image: /Users/Zhaiyue/VISIUMHDdata/HDA2_count/outs/segmented_outputs/cloupe.cloupe}
  # D2 patient ID inferred from the embedded image name HD7743.jpg; to be confirmed
  - {sample_id: D2, patient_id: HD7743, outs: HDD2_count/outs, he_image: /Users/Zhaiyue/VISIUMHDdata/HDD2_count/outs/segmented_outputs/cloupe.cloupe}

image:
  model_mpp: 0.25            # CellViT++ is a x40 model and always infers at ~0.25 µm/px (other resolutions are interpolated internally); UNI2-h 112 µm tiles are resized to 224 px
  # The four sections differ in native resolution (A1/D1 ~0.36, A2/D2 ~0.68 µm/px), which is confounded with patient.
  # Primary analysis: downsample every section to effective_mpp, then resample to model_mpp, so effective resolution matches;
  # sensitivity analysis: effective_mpp: null (native resolution).
  effective_mpp: 0.68

cellvit:
  model: HIPT                # HIPT first; SAM-H is computationally heavy
  outdir_name: cellvit
  malignant_classes: [Neoplastic]          # primary analysis
  epithelial_classes: [Neoplastic, Epithelial]  # sensitivity analysis
  device: mps                # Mac Studio; the official code hard-codes cuda and needs adapting

matching:
  max_centroid_dist_um: 4.0  # maximum centroid distance between CellViT and 10x nuclei
  min_iou: 0.1               # 10x nucleus polygons are built from 2 µm bins, so IoU is inherently low

gating:
  # Malignant epithelial nucleus = pathologist tumour region AND CellViT++ class.
  # No hard gating on single-cell expression: keratin has only ~0.3 UMI per cell and acinar transcripts diffuse into most cells (script 01).
  # Expression is used only for region-level QC (epithelial enrichment, low acinar fraction).
  tumor_annotation_dir: /Users/Zhaiyue/PDAC_HE_Morphotype/data/annotations   # {sample_id}_tumor.geojson (QuPath, full-resolution coordinates)
  epi_genes: [KRT19, KRT8, KRT18, EPCAM, KRT7]
  region_min_keratin_umi_per_100um: 20
  region_max_acinar_share: 0.2

analysis:
  primary_unit: region       # primary: micro-regions; cells are auxiliary
  # Split-half reliability from script 01 (range over 4 samples): MPAS 50µm 0.16–0.27 | 100µm 0.35–0.66 | 150µm 0.57–0.85 | 200µm 0.66–0.90
  #                                          Classical/Basal 100µm 0.49–0.97
  region_sizes_um: [100, 150, 200]
  primary_region_um: {MPAS: 150, MAPK_extended: 150, moffitt_classical: 100, moffitt_basal: 100}   # fixed before modelling
  min_malignant_nuclei_per_region: 5
  min_target_pool_umi_per_region: 500   # non-acinar UMI of the target pool (malignant cells)
  targets_primary: [MPAS]
  targets_secondary: [MAPK_extended, moffitt_classical, moffitt_basal]
  score: log_sum_cp10k       # log1p(1e4 * programme-gene UMI / non-acinar non-endocrine total UMI)
  target_pool: malignant     # malignant: pool only 10x cells matched to malignant nuclei; sensitivity: all (all cells in the region)
  decision_min_dR2: 0.02     # prespecified: ΔR²(AB−B) above this value in >= 3/4 patients and above the 95th percentile of spatial-shift and random-gene-set nulls
  context:
    tile_um: 112             # UNI2-h: 112 µm (448 px at 0.25 µm/px) resized to 224 px ≈ 0.5 µm/px
    mode: ring               # ring: mean of 8 non-overlapping tiles around the centre region (centre fully hidden)
    sensitivity_modes: [masked_center]   # one large window with the centre greyed out
  feature_sets:              # every model includes Q (technical covariates)
    Q:   [Q]
    H:   [H, Q]              # classical nuclear morphology (area, roundness, haematoxylin intensity, ...)
    A:   [A, Q]              # CellViT++ nuclear embedding
    B:   [B, Q]              # neighbourhood UNI2-h with the centre masked
    AB:  [A, B, Q]
    HB:  [H, B, Q]
    AHB: [A, H, B, Q]
  key_contrasts:             # ΔR² = R²(full) − R²(reduced)
    - [AB, B]                # increment of nuclear morphology beyond the neighbourhood (primary metric)
    - [AHB, HB]              # increment of deep embedding beyond classical morphology + neighbourhood
    - [HB, B]
  model: ridge
  alphas: [0.1, 1, 10, 100, 1000, 10000]
  pca_components: {A: 50, B: 50}
  per_slide_feature_centering: false   # sensitivity analysis sets true (no labels used, but test-section features are used)
  n_spatial_permutations: 200
  n_random_genesets: 200
  random_seed: 20261014
