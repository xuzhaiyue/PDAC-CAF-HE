  # ------------------------------------------------------------------------------------
  # 2026-10-21 the main line became 'CAF state and amount must be measured separately'. A10 and A11 were added to support it;
  # both were proposed after seeing the A5–A9 / fig2_meta results and must be reported as post hoc in the paper.
  A10_bulk_vs_spatial_teacher:     # 2026-10-21 approved by user; augmented before execution
    status: frozen_2026-10-21
    question: "on the same PDAC spatial sections, which H&E model reads out CAF state: one taught by bulk RNA (TCGA training) or one taught by spatial transcriptomics (pan-cancer spatial pretraining)?"
    slides: "all 70 A9 sections (62 GEO + 4 HEST + 4 PDAC Visium HD; 25 patients, grouped by the corrected A9 rule); 10x (A6) exploratory reference only"
    arms:
      S0_bulk_teacher: "I1_bulk: trained on TCGA bulk only, configuration identical to A5 / A8 (train_i1 of he_10, no HD, 3 SEEDS of he_14, TCGA tile statistics for standardisation). Weights saved for reuse"
      S1_spatial_teacher_no_pdac: "pan-cancer spatial pretraining, zero-shot: reads only results/he/A9/models/pretrain_seed*.pt and feature_stats.pt (no retraining or rewriting); never saw any PDAC spatial label"
      S2_spatial_teacher_pdac: "A9 leave-one-patient-out fine-tuning: read directly from results/he/A9/lopo_spatial.tsv (not re-run)"
    evaluation_rule: "identical to A8 / A9: HEST / GEO use spot + neighbourhood regions and the CAF-rich rule, measured relative state = log1p CP10k programme − pan-CAF (rel of load_sample); PDAC Visium HD uses the A5 150 µm rule (S0 from I1_bulk 150 µm in A5/spatial.tsv, S1 via he_14.eval_own)"
    sanity: "S0 ρ on the 4 HEST sections within 0.05 of I1_bulk (TCGA) in A8/pdac.tsv; S1 on the original 8 sections within 0.05 of A8 zero-shot; if not, investigate before reporting"
    statistics:
      unit: "patient (ρ of several sections of one patient averaged first), 25 patients"
      primary: "S1 − S0: patient-level two-sided Wilcoxon signed-rank test + patient cluster bootstrap (2000) 95% CI of the median paired difference"
      secondary: "S2 − S0, S2 − S1; described by source, primary / metastasis and treatment; fraction of sections with ρ >= 0.3"
    success: "primary: median paired Δρ = S1 − S0 > 0 with two-sided Wilcoxon p < 0.05. If not met, reported as is (this would weaken the bulk-to-spatial transition and the wording would need revisiting)"
    outputs: "results/he/A10/{slide_rho.tsv, patient_rho.tsv, paired_tests.tsv, models/}"
    load: "nice 19, 2 threads; S0 training uses the A5 configuration; everything else is inference only"
    interpretation: "compares transfer of training schemes; cancer types, data size, training targets, model heads and budgets differ, so differences cannot be attributed to the supervision type alone. pan-CAF is a molecular abundance proxy, not a direct cell count."
    paired_rules: "all arms share regions/labels/CAF-rich masks within each section; section rho averaged equally within patients. Undefined rho not set to zero; reasons saved, and the primary comparison uses patients complete in all three arms; primary contrast S1-S0, secondary contrasts not confirmatory. Wilcoxon two-sided, zero_method=wilcox, method=approx, ties kept; all-zero differences p=1. Patient-equal bootstrap 2000 percentile CI, seed=20261021."
    sanity_policy: "sanity table saved before the formal comparison; any absolute difference > 0.05 or non-finite value stops the run; models are not adjusted to fit results. S0 on PDAC Visium HD uses the same three-seed models and is checked against A5 (tolerance 0.05); historical model instances are not mixed in."
    runtime: "dated run subdirectory; S0 80 epochs, seeds 0/1/2, up to 1024 tiles per step, A5 optimiser unchanged, 0.01 s pause per step, 0.5 s per epoch; inference in chunks of 256. Pause while load > 8, 2 threads, nice 19. The 10x section cannot match the full LOPO design for all three arms; the stored A6 result is a reference only and not part of the primary test."
    paths:
      a9: results/he/A9
      a8: results/he/A8
      a5: results/he/A5
      hd: results/he/hd
      output: results/he/A10
    authorization: "rules completed, then fixed and run immediately with explicit approval; this is a post hoc addition."
  A11_state_within_abundance_strata:   # 2026-10-21 draft, fixed after confirmation; no survival association computed before then
    status: frozen_2026-10-21
    question: "is the prognostic meaning of CAF state masked by CAF amount: with state and amount in the same model, and separately within high / low amount strata, is state associated with poor prognosis?"
    cohorts: "the same 8 cohorts as fig2_meta (TCGA, CPTAC, GSE28735, GSE62452, GSE57495, GSE71729, GSE85916, GSE21501), same samples, scores and OS definitions; reads existing *_scores.tsv and *_clinical.tsv under results/fig2/"
    variables: "state = program_rel; amount = pan_CAF (both z-scored within cohort); repeated for Moffitt_activated_rel and Dominguez_LRRC15_rel (each with the same pan_CAF)"
    models:
      primary_joint: "per-cohort Cox: OS ~ state + amount; pooled log HR of state (REML random effects, fixed effect and I² also reported)"
      strata: "within each cohort, split at the pan_CAF median into high / low amount; per-stratum Cox: OS ~ state; pooled by stratum"
      interaction: "per-cohort Cox: OS ~ state × amount; interaction term pooled"
      masking_check: "pooled HR of amount itself in the joint model, and pooled HR of the raw programme score (program), to explain why the raw score is not significant"
      descriptive: "KM plots of the four state high / low × amount high / low groups (between-group HR from Cox stratified by cohort), descriptive only"
      sensitivity: "exclude GSE71729 (Moffitt discovery cohort); secondary model adds ESTIMATE stromal score + Moffitt basal−classical (as fig2_meta)"
    success: "primary: pooled HR of state in the joint model > 1 with p < 0.05. Secondary: pooled HR of state > 1 in both strata (same direction), interaction p reported as is; if the interaction is significant, conclusions are drawn per stratum"
    outputs: "results/fig2/A11/{per_cohort.tsv, pooled.tsv, km_*.pdf}"
    script: "fig2/fig2_08_state_within_abundance.R (R, run from the project root)"

    operational_rules: "patients included as in the original meta-analysis (OS_time > 0 and OS 0/1); z-scored within cohort before stratification, not re-scored after. pan_CAF equal to the cohort median goes to the low stratum; state high/low by the whole-cohort median, ties low. Models use complete cases, with inclusion masks and exclusion reasons saved. Models with no events/constant variables/non-convergence or infinite coefficients are listed and not pooled; cohorts are not selected by p value; low event counts are flagged, not removed."
    diagnostics: "per cohort, PH tests, event counts and coefficients/correlations saved; significant PH violations are not silently fixed and are reported as limitations. Interaction uses continuous variables; strata are descriptive only. program_rel + pan_CAF and program + pan_CAF are reparameterisations and cannot prove an amount-cancellation mechanism."
    multiplicity: "the only primary test = random-effects HR of program_rel in the joint model; M/D, strata, interaction, raw scores, excluding GSE71729 and covariate models are secondary/exploratory; heterogeneity is not inferred from one stratum being significant and the other not."
    descriptive_rule: "KM plotted per cohort; the four-group HR from Cox with strata(cohort). The secondary adjusted joint model includes state, pan_CAF, ESTIMATE stroma and basal-classical; GEO ESTIMATE recomputed as in fig2_06 and saved only in this run directory."
    runtime: "dated run subdirectory, nice 19, 2 threads; seed=20261021; R survival/metafor/estimate."
    paths:
      source: results/fig2
      output: results/fig2/A11
    authorization: "rules completed, then fixed and run immediately with explicit approval; this is a post hoc addition."
  A12_a10_patch_scale_robustness:  # 2026-10-21 user-approved 2x2 scale sensitivity, frozen before extraction/inference.
    status: frozen_2026-10-21
    reason: "A10 bulk training used 128 µm inputs and spatial pretraining 112 µm, so the public-section evaluation had mismatched input scales and needs a same-scale comparison. Platforms/sources also differ, so source contrasts can only suggest confounding and cannot prove a causal scale explanation."
    design: "66 public sections (62 GEO + 4 HEST): S0 bulk / S1 spatial zero-shot × input 112/128 µm, a 2×2 comparison. 112 uses the original cache, 128 re-extracts true fields; the same 128 features serve both models, no training. The 4 PDAC Visium HD sections only have the original 128 µm input and act as a fixed anchor; they must not be described as having a 112 µm replicate condition."
    primary: "S1_128 − S0_128 across all 70 sections at a common 128 µm input: section rho averaged equally within patients, then the median paired difference over 25 patients; median difference > 0 with two-sided Wilcoxon p < 0.05 passes. Passing only indicates robustness to this scale and does not remove confounding by training cancer type/size/target/model head."
    secondary: "S1 − S0 at 128 µm in the 66 public sections (21 patients); original 112 S1 − S0; each at its training scale S1_112 − S0_128; S0_128 − S0_112, S1_128 − S1_112 and the difference of the two scale effects; described by source/tissue. Secondary significance never replaces the primary endpoint. S2 kept as a historical reference only, no additional training."
    statistics: "as A10: section rho averaged within patients, median paired difference over patients; two-sided Wilcoxon (method=approx, zero_method=wilcox), all-zero differences p=1; patient-equal bootstrap 2000 percentile 95% CI, seed 20261021. Patients complete in all arms; non-finite rho not set to 0; no samples removed based on model performance."
    evaluation: "reuses the A10 per-sample region index, relative state rel and CAF-rich mask exactly; 128 only replaces features, with coordinates/counts/barcodes/labels/neighbourhoods unchanged. Region indices, labels and masks of all arms checked item by item. Original A10 results for PDAC Visium HD fixed."
    geometry: "GEO reuses he_16 image reading/original positions and scaling; unrounded image centres recovered in original barcode order must equal the old coords after rounding. Old HEST h5 coords are tile top-left corners, so image centre = coords + patch_size_src/2, checked against obsm/spatial for each barcode (<= 1 pixel); labels keep the old coords. 128 only enlarges the field and does not shift the centre."
    extraction: "UNI2-h loaded offline read-only from local weights with the original timm preprocessing. GEO keeps the original he_16 border cropping and resize-to-224; HEST cropped by metadata µm/px then resized to 224. Border flags kept, never used to drop by performance. Features float16, 1536 dimensions, original cache not overwritten; encoder in eval/inference_mode, no retraining or refitting of standardisation."
    sanity: "before the formal A12 comparison: 8 evenly spaced spots per GEO source and per HEST sample rebuilt as 112 µm tiles, cosine of encoded features with the old cache median >= 0.98 and minimum >= 0.90; original 112/old HD inference rho within 0.001 of A10; any failure stops the formal comparison for investigation and recording; preprocessing is never chosen by final rho. For 128, regions and masks of every sample match A10 with identical n_regions."
    paths:
      a10: results/he/A10/2026-10-21_run01
      a9: results/he/A9
      a8: results/he/A8
      geo_raw: /Volumes/INTENSO_BIG/PDAC_spatial_public
