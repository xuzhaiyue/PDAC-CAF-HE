    endpoint: "overall survival (TCGA: TCGA-CDR OS; CPTAC: vital_status + follow_up_days)"
    models: {univariable: "per 1 SD (z-scored within cohort)", multivariable: "+ age + stage (I–IIA vs IIB–IV)"}
    pooling: "TCGA + CPTAC fixed-effect pooling (primary), random effects (sensitivity)"
