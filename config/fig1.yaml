    GSE28735: {platform: GPL6244, probe_map: GPL6244_probe2symbol.tsv, keep: "tissue: T", time: survival_month, event: cancer_death, time_unit: month}
    GSE62452: {platform: GPL6244, probe_map: GPL6244_probe2symbol.tsv, keep: "tissue: Pancreatic tumor", time: survival months, event: survival status, time_unit: month}
    GSE57495: {platform: GPL15048, probe_map: GPL15048_probe2symbol.tsv, time: "overall survival (month)", event: vital.status, time_unit: month}
