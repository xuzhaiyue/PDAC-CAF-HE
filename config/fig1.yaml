# 2026-10-20 H&E 主线（Figure 3–5）：草案 v2，待用户确认后冻结；确认前不训练、不评估。
# 与 v1 的差别：恢复此前约定的三项方法创新（加和式图块预测、混合监督、状态/数量解耦），
# 加入 Moffitt / Dominguez 基因集作为全程比较对象，并用 StRoMA 的 3 基因评分做流程基准（不弱于范文）。
he_model:
  status: frozen_2026-10-20  # 用户确认 v2；公开 Visium HD 下载与编码器比较待用户另行决定（未下载）
  features:
    source: "Mahmood Lab 预提取 UNI2-h（20×、256 px、1536 维；CC-BY-NC-ND-4.0）；只读"
    tcga: /Volumes/zhaiyue/TFF1/project_PanCancer_Neddylation/01_raw/uni2h_features/tcga_paad   # 146/147 例
    cptac: /Volumes/zhaiyue/TFF1/project_PanCancer_Neddylation/01_raw/uni2h_features/cptac_pda  # 135/135 例
    tiles_per_slide: 4000
    known_limits: ["TCGA 官方图块只覆盖约一半组织", "CPTAC 切片未标注肿瘤/癌旁", "两队列扫描与切块方式不同",
                   "TCGA/CPTAC 只有 UNI2-h 特征，无法做编码器比较（需另下载全切片）"]
  targets:                                   # TCGA bulk，队列内 z 标准化
    ours: {state: program_rel, abundance: pan_CAF, raw: program}
    comparators: {M_rel: Moffitt_activated_rel, M_raw: Moffitt_activated, D_rel: Dominguez_LRRC15_rel, D_raw: Dominguez_LRRC15}
    benchmark: {StRoMA_3gene: [COL12A1, LOX, LOXL2]}   # 只用于检验我们的流程不弱于范文（范文 CPTAC ρ = 0.458）
  innovations:
    I1_additive_decoupled: >
      每个图块输出两个非负局部量：程序表达 p_i、泛 CAF 表达 c_i（softplus）。切片层面按 bulk 的生物学定义线性汇总：
      P = mean(p_i)，C = mean(c_i)；预测的数量 = log C，预测的状态 = log P − log C。
      损失同时拟合 bulk 的 log 程序与 log 泛 CAF。状态与数量在结构上分开；图块输出就是该位置的局部预测，可直接与 Visium HD 对比。
    I2_mixed_supervision: >
      在 I1 的损失中加入 Visium HD 的局部标签（每个图块位置实测的程序与泛 CAF 表达），与 TCGA bulk 标签一起训练。
      评估用留一患者（4 例自有 Visium HD 轮流留出）；若用户同意下载，另用 10x 公开胰腺癌 Visium HD 作完全独立的空间测试。
    I3_state_abundance: "状态与数量分别验证：预测状态需在控制 bulk 泛 CAF 后仍与 bulk 状态相关；预测数量需与 ESTIMATE / 病理基质比例相关"
  baselines:                                 # 消融与范文式对照，全部同样的 CV 与外部测试
    B1_ridge_meanpool: "均值池化 + 岭回归，直接回归各目标"
    B2_abmil_slide: "注意力 MIL 直接回归切片层面得分（范文式：只有切片输出，注意力权重作热图）"
    ablations: ["I1 vs B2（加和式 vs 注意力）", "I1+I2 vs I1（有无混合监督）", "I1 的 log 比值 vs 直接回归相对得分"]
  evaluation:
    tcga_cv: "患者层面 5 折 × 5 次重复；折外 Spearman ρ"
    cptac_external: "全部 TCGA 训练 → CPTAC；Spearman ρ；1000 次置换"
    decoupling: "CPTAC：偏 ρ(预测状态, bulk 状态 | bulk 泛 CAF)；预测数量 vs ESTIMATE 与病理基质比例"
    spatial: "Visium HD 150 µm 区域（100 µm 敏感性）：每个样本预测 vs 实测的 Spearman ρ；比较 I1、I1+I2、B2"
    prognosis: "H&E 预测的状态 / 数量 / 原始得分，以及 M、D 的预测值：TCGA 折外 + CPTAC，每 1 SD HR，两队列合并"
    benchmark: "StRoMA 3 基因评分用同一流程预测，CPTAC ρ 与范文报告的 0.458 比较"
  success:
    cptac_state_rho: 0.30
    tcga_cv_state_rho: 0.30
    cptac_decoupling: "偏 ρ > 0 且 p < 0.05"
    spatial: "I1（或 I1+I2 留一患者）在 4 例中至少 3 例 ρ ≥ 0.3"
    innovation_claim: "I1 或 I1+I2 在 CPTAC 或空间验证上优于 B2，才写成方法学改进；否则如实报告为持平"
    not_weaker_than_StRoMA: "我们流程预测 StRoMA 3 基因评分的 CPTAC ρ 不低于 0.458 的 95% CI 下限"
    prognosis: "次要：合并 HR > 1 且 p < 0.05"

