  A14_domain_shift_exploratory:   # 2026-10-27 draft (observation: the FFPE PDAC Visium HD sections resemble TCGA in appearance while public sections do not, and perform worse); fixed after confirmation
    status: frozen_2026-10-27
    nature: "post hoc exploratory analysis (proposed after seeing A10/A12 ρ by source), labelled as such in the paper"
    question: "the less a section's H&E appearance resembles the TCGA training slides, is the local readout ρ of the bulk-trained model (S0) lower? Is the spatially trained model (S1, multi-source HEST pretraining) less sensitive to this?"
    slides: "the 70 A12 sections (66 public with A12 128 µm features; 4 PDAC Visium HD with the 128 µm features in results/he/hd), 25 patients, grouped as A9"
    domain_metric:
      primary: "UNI2-h feature-domain distance: PCA (50 dimensions, TCGA only) fitted on TCGA training tiles (results/he/cache_own, all 146 patients); per section = median Mahalanobis distance of all valid tiles to the TCGA tile mean in PCA space. Computed from image features only, without reading any ρ"
      descriptive: "colour: mean optical density of tissue tiles per section and the angle between Macenko H / E stain vectors and the TCGA reference; sample type (FFPE / frozen)"
    statistics:
      unit: "patient (distance and ρ of several sections averaged first), 25 patients"
      primary: "Spearman(domain distance, S0_128 ρ), two-sided p; expected negative"
      secondary: "Spearman(domain distance, S1_128 ρ); patient bootstrap (2000, seed 20261021) 95% CI of the difference between the two correlations; described by source / sample type"
    success: "primary: S0 Spearman ρ < 0 with p < 0.05 → supports 'the bulk model degrades when appearance departs from TCGA'. Regardless of the result, domain distance is strongly confounded with source and sample type and can only be a mechanistic hint, not proof of causation"
    not_included: "re-extraction after stain normalisation (interventional test) is not part of A14; to be decided after A14"
