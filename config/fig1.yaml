    GSE85916: {platform: GPL13667, probe_map: GPL13667_probe2symbol.tsv, time: os.year, event: death, time_unit: year}
    # GPL4133 platform table downloaded 2026-10-19 (ID→GENE_SYMBOL only) and included by the prespecified rule; inclusion decided before seeing its results
    GSE21501: {platform: GPL4133, probe_map: /Users/Zhaiyue/PDAC_HE_Morphotype/data/external/GPL4133_probe2symbol.tsv, keep: "tissue: Patient Primary Pancreatic Tumor", time: os time, event: os event, time_unit: month, channel: 2}
  excluded:
    GSE79668: "series matrix has no expression data"
  notes:
    GSE71729: "Moffitt 2015 discovery cohort: the Moffitt activated-stroma gene set was derived here, so it is not independent for that gene set (sensitivity analysis excluding it reported)"
  probe_collapse: max_mean       # for genes with several probes, the probe with the highest mean expression
  scores: same_as_fig2           # same score definitions as fig2 (gene-set mean; relative = minus pan-CAF)
  models:
    primary: univariable          # covariates differ between cohorts → primary analysis univariable: HR per 1 SD (z-scored within cohort)
    secondary: "x + ESTIMATE stromal score + Moffitt basal−classical (computable from expression in every cohort)"
  pooled_cohorts: [TCGA, CPTAC, GSE28735, GSE62452, GSE57495, GSE71729, GSE85916, GSE21501]   # TCGA/CPTAC recomputed with the same univariable/secondary models
  meta: {method: random_effects_REML, also_report: fixed_effect, heterogeneity: I2}
  primary_score: program_rel
  also_report: [program, CTHRC1_alone, Moffitt_activated, Moffitt_activated_rel, Dominguez_LRRC15, Dominguez_LRRC15_rel, pan_CAF, Moffitt_basal_minus_classical]
  success: "random-effects pooled HR of program_rel with p < 0.05 (univariable primary); secondary model in the same direction"

# ======================================================================================
# 2026-10-20 H&E line: draft v2, fixed only after confirmation; no training or evaluation before then.
# Changes from v1: restores the three planned methodological elements (additive tile prediction, mixed supervision, state/amount decoupling),
# adds the Moffitt / Dominguez gene sets as comparators throughout, and uses the StRoMA 3-gene score as a pipeline benchmark (not weaker than StRoMA).
he_model:
  status: frozen_2026-10-20  # confirmed v2; download of public Visium HD and encoder comparison left for a separate decision
  features:
    source: "Mahmood Lab pre-extracted UNI2-h (20×, 256 px, 1536 dimensions; CC-BY-NC-ND-4.0); read only"
    tcga: /Volumes/zhaiyue/TFF1/project_PanCancer_Neddylation/01_raw/uni2h_features/tcga_paad   # 146/147 patients
    cptac: /Volumes/zhaiyue/TFF1/project_PanCancer_Neddylation/01_raw/uni2h_features/cptac_pda  # 135/135 patients
    tiles_per_slide: 4000
    known_limits: ["official TCGA tiles cover only about half of the tissue", "CPTAC slides not labelled tumour/adjacent", "scanning and tiling differ between cohorts",
                   "TCGA/CPTAC only have UNI2-h features, so encoders cannot be compared (would need whole slides)"]
  targets:                                   # TCGA bulk, z-scored within cohort
    ours: {state: program_rel, abundance: pan_CAF, raw: program}
    comparators: {M_rel: Moffitt_activated_rel, M_raw: Moffitt_activated, D_rel: Dominguez_LRRC15_rel, D_raw: Dominguez_LRRC15}
    benchmark: {StRoMA_3gene: [COL12A1, LOX, LOXL2]}   # only to check our pipeline is not weaker than StRoMA (StRoMA CPTAC ρ = 0.458)
  innovations:
    I1_additive_decoupled: >
      each tile outputs two non-negative local quantities: programme expression p_i and pan-CAF expression c_i (softplus). Slide level aggregates linearly, as in bulk:
      P = mean(p_i), C = mean(c_i); predicted amount = log C, predicted state = log P − log C.
      the loss fits bulk log programme and log pan-CAF together. State and amount are separated by construction; tile outputs are local predictions directly comparable with Visium HD.
    I2_mixed_supervision: >
      local Visium HD labels (measured programme and pan-CAF expression at each tile) are added to the I1 loss and trained together with TCGA bulk labels.
      evaluated leave-one-patient-out (each of the 4 PDAC Visium HD sections held out in turn); if download is approved, the public 10x PDAC Visium HD section serves as a fully independent spatial test.
    I3_state_abundance: "state and amount validated separately: predicted state must correlate with bulk state after controlling bulk pan-CAF; predicted amount must correlate with ESTIMATE / pathology stromal fraction"
  baselines:                                 # ablations and StRoMA-style comparators, all with the same CV and external test
    B1_ridge_meanpool: "mean pooling + ridge regression, direct regression of each target"
    B2_abmil_slide: "attention MIL regressing slide-level scores directly (StRoMA style: slide output only, attention weights as heat map)"
    ablations: ["I1 vs B2 (additive vs attention)", "I1+I2 vs I1 (with or without mixed supervision)", "I1 log ratio vs direct regression of the relative score"]
  evaluation:
    tcga_cv: "patient-level 5-fold × 5 repeats; out-of-fold Spearman ρ"
    cptac_external: "train on all TCGA → CPTAC; Spearman ρ; 1000 permutations"
    decoupling: "CPTAC: partial ρ(predicted state, bulk state | bulk pan-CAF); predicted amount vs ESTIMATE and pathology stromal fraction"
    spatial: "Visium HD 150 µm regions (100 µm sensitivity): Spearman ρ of predicted vs measured per sample; compare I1, I1+I2, B2"
    prognosis: "H&E-predicted state / amount / raw score, plus predicted M and D: TCGA out-of-fold + CPTAC, HR per 1 SD, both cohorts pooled"
    benchmark: "StRoMA 3-gene score predicted with the same pipeline; CPTAC ρ compared with the reported 0.458"
  success:
    cptac_state_rho: 0.30
    tcga_cv_state_rho: 0.30
    cptac_decoupling: "partial ρ > 0 and p < 0.05"
    spatial: "I1 (or I1+I2 leave-one-patient-out) ρ >= 0.3 in at least 3 of 4 sections"
    innovation_claim: "described as a methodological improvement only if I1 or I1+I2 beats B2 on CPTAC or spatial validation; otherwise reported as equivalent"
    not_weaker_than_StRoMA: "CPTAC ρ of our pipeline for the StRoMA 3-gene score not below the lower 95% CI bound of 0.458"
    prognosis: "secondary: pooled HR > 1 and p < 0.05"

# 2026-10-20 he_model amendments (approved; fixed before any amended analysis was run). First-round results (he_02) are kept and reported.
he_amendments:
  A1_gc_protocol:                  # ridge-only protocol following an earlier in-house pipeline
    target_scoring: "each gene z-scored within training folds, then averaged (genes equally weighted); external cohorts use their own gene means / SDs"
    state_definitions:
      primary: residual            # linear-regression residual of the gene-set score on the pan-CAF score (coefficients fitted in training folds)
      also: subtraction            # gene-set score − pan-CAF score (as in round one, for comparison)
    targets: [program, pan_CAF, Moffitt_activated, Dominguez_LRRC15, StRoMA_3gene]   # the first three also have residual / subtraction states
    ridge: "StandardScaler + Ridge; GridSearchCV alpha = logspace(-2, 4, 13), inner 4-fold shuffled KFold, scoring = MSE"
    slide_aggregation: "tile mean within each slide, then equal-weight mean of slides within patient"
    cv: "same 5-fold × 5 repeats as round one (KFold seed unchanged)"
    metrics: "Pearson r (2000-bootstrap 95% CI), Spearman ρ, R² (TCGA CV, computed after averaging repeats per patient); CPTAC also 1000 permutations"
  A2_nested_tuning:                # nested tuning with equal budgets for I1 and B2
    grid: {lr: [1.0e-4, 3.0e-4, 1.0e-3], epochs: [20, 40, 80], weight_decay: [1.0e-4, 1.0e-2]}   # 18 combinations; epochs are 20/40/80 checkpoints of one run
    cv: "outer 5-fold × 1 repeat (rep 0 folds of round one); 3-fold tuning within each outer training set"
    selection_metric: "inner Spearman ρ of the predicted state (A1 residual definition)"
    targets: "as A1 (I1 heads fit each gene-set score; state derived from outputs by subtraction and by training-fold residual)"
    cptac: "same 3-fold tuning on all TCGA; final configuration trained with 5 seeds and averaged"
    logging: "training loss curves saved"
  A3_own_tcga_features:            # download of 209 TCGA-PAAD diagnostic slides approved 2026-10-20; fixed before any feature extraction
    reason: "QC showed the official pre-extracted TCGA features cover only about half of the tissue (acinar content ρ = 0.08 vs 0.44 in CPTAC)"
    slides: /Volumes/INTENSO/TCGA_PAAD_svs   # .svs after md5 check
    protocol: "following extract_uni2h_embeddings.py of an earlier in-house pipeline: thumbnail tissue mask (HSV saturation > 18, brightness 40–235), 128 µm field (level-0 pixels from mpp), tissue fraction >= 0.5, UNI2-h timm preprocessing"
    tiles_per_slide: 1000          # 1000 to improve coverage and support tile-level I1 (seed = file_id hash)
    load_control: "nice 10, batch size 16, pause when system load is high"
    downstream: "A1 (ridge) and A2 (I1 / B2 nested tuning) all re-run with the new features; results with the old features kept and reported"
    cptac_caveat: "CPTAC still uses the Mahmood pre-extracted features (also UNI2-h, 20×); extraction differs between cohorts and is reported as a limitation"
  A4_stroma_model_replication:     # approved 2026-10-20; fixed before training. Diagnostic analysis; does not change the main analysis
    purpose: "test whether the StRoMA TCGA internal results (Spearman 0.655, AUC 0.811) can be reproduced with its model design"
    cohort: "all TCGA PAAD primary tumours (176 with self-extracted features; 178 in StRoMA); trained per slide, folds by case, evaluated as case-level means"
    target: "COL12A1/LOX/LOXL2: log2 expression z-scored per gene, then averaged; re-standardised within each training fold"
    model: >
      following the StRoMA Methods and Table 1 (UNI column): Linear(1536→64)+ReLU+Dropout(0.5); 2D sinusoidal positional encoding (tile grid coordinates);
      1-layer 8-head Transformer encoder (FF 512, Pre-LN); learnable CLS cross-attends through a 1-layer 8-head Transformer decoder; Dropout + Linear(64→1).
      loss SmoothL1(δ=1) + 0.5 × pairwise ranking loss (margin 0.1, only pairs with |Δy| > 0.05); AdamW lr 5e-5, wd 5e-4, cosine annealing, up to 200 epochs;
      physical batch 1, gradient accumulation 8; Manifold Mixup α = 0.2 (projected tile features and targets interpolated together); 1024 random tiles per epoch sorted by position in training,
      1024 evenly spaced tiles at evaluation; early-stopping patience 15.
    cv: "StratifiedKFold 10 folds (stratified on the median split), same folds as he_07"
    variants:
      honest: "early stopping on a stratified 10% validation split of the training folds; the test fold is never used"
      leaky_as_reported: "early stopping on the test fold itself (as StRoMA appears to have done). Diagnostic only, no conclusions drawn"
    metrics: "per-fold mean ± SD of Spearman and AUC(Z>0) (as reported by StRoMA), plus Spearman / AUC of pooled out-of-fold predictions"
    features: "self-extracted UNI2-h whole-slide features (no Macenko normalisation); the 'UNI, 1536 dimensions' described by StRoMA matches UNI2-h"
  A5_mixed_supervision_and_spatial:   # approved 2026-10-20 ('mixed supervision; stroma only + spatial validation'); fixed before training
    hd_tiles: "results/he/hd/{A1,D1,A2,D2}.npz (he_09: 128 µm, all tissue tiles, UNI2-h; pseudo-bulk labels of nucleated cells in each tile)"
    hd_label_filter: "cells per tile >= 5, non-acinar total UMI >= 500, pan-CAF UMI >= 5"
    hd_local_targets: "log1p(1e4 × programme UMI / non-acinar UMI) and log1p(1e4 × pan-CAF UMI / non-acinar UMI), z-scored within sample"
    models:
      I1_bulk: "configuration selected by A2 on all TCGA (lr 3e-4, wd 1e-2, 80 epochs), TCGA bulk labels only"
      I1_I2_mixed: >
        same I1 architecture; each step = bulk loss of 1 TCGA patient + local loss of 256 HD tiles (weight 1);
        local prediction = a_k·log(p_ik) + b_k (same a, b as at slide level, k = programme / pan-CAF heads), HD labels matched after within-sample z-scoring; otherwise as I1_bulk
      B2_attention: "configuration selected by A2 on all TCGA; spatial map = attention weights (as in StRoMA)"
      ridge_tile: "A1 ridge on self-extracted features, applied directly to single-tile features to obtain tile predictions"
      stroma_only: "mean pooling + ridge over the 30% of tiles with the highest I1_bulk pan-CAF local output (stroma only); for the bulk prediction comparison"
    spatial_eval:
      design: "I1_I2_mixed leave-one-patient-out (each of the 4 HD sections held out in turn); other models do not train on HD and are evaluated directly on the 4 sections"
      regions: "150 µm grid (primary), 100 µm (sensitivity); tiles aggregated into the region containing their centre"
      region_label: "pseudo-bulk of nucleated cells in the region: relative state = log1p CP10k(programme) − log1p CP10k(pan-CAF)"
      region_pred: "I1: log(mean p in region) − log(mean c in region); B2: mean attention; ridge: mean tile prediction"
      region_filter: "CAF-rich regions (pan-CAF UMI >= 10 /(100 µm)², as hd_measurability), cells >= 5, acinar fraction <= 20%"
      metric: "region-level Spearman ρ per sample (predicted vs measured relative state)"
      success: "ρ >= 0.3 in >= 3/4 samples (original he_model criterion); the innovation holds only if I1 or I1_I2 beats B2 in >= 3/4 samples"
    bulk_eval: "I1_I2_mixed (all 4 HD sections in training) re-evaluated on TCGA 5-fold (A2 rep 0 folds) and CPTAC external; Spearman and AUC reported; stroma_only evaluated likewise"
  A6_10x_independent_spatial:      # download approved 2026-10-20; fixed before any prediction or evaluation
    data: "/Volumes/INTENSO_BIG/10x_VisiumHD_3prime_Human_Pancreatic_Cancer (Visium HD 3′, fresh frozen, Space Ranger 4.0.1, CC BY 4.0)"
    role: "fully independent spatial test, not used in any training or selection; all models (I1_bulk, I1_I2_mixed trained on all 4 PDAC Visium HD sections, B2, ridge_tile) evaluated once after fixing"
    tiles: "as he_09: 128 µm, tissue mask, all tissue tiles, UNI2-h; image = tissue_image.btf (0.274 µm/px)"
    labels: "8 µm bins (no nucleus segmentation) aggregated by bin centre into tiles / regions; the region filter 'cells >= 5' is replaced by 'region non-acinar UMI >= 500'; other filters (pan-CAF UMI threshold, acinar <= 20%) unchanged"
    metric_success: "as A5: Spearman ρ in CAF-rich regions at 150 µm (primary) / 100 µm; single sample, 95% bootstrap CI reported"
    caveats: ["fresh-frozen section (training used FFPE)", "3′ whole-transcriptome chemistry (the PDAC Visium HD sections are probe-based)"]
  A7_prognosis_he_predicted:       # fixed before any survival association was computed
    predictions:
      primary_model: "I1 (bulk training only; A2 nested tuning): TCGA = A2 outer 5-fold out-of-fold predictions; CPTAC = trained on all TCGA, mean of 5 seeds"
      comparators: ["B2 attention MIL (A2, same source)", "ridge (A1 self-extracted features; TCGA = mean of 5×5 out-of-fold predictions)"]
