  A16_geo_true_scale:   # confirmed 2026-10-28 (re-extract public section features under the 65 µm convention); post hoc, does not replace any fixed A9–A15 result
    status: frozen_2026-10-28
    reason: "he_16 / A12 used µm/px = 55 / spot_diameter_fullres / ratio for the 62 public GEO sections, but Space Ranger spot_diameter_fullres corresponds to 65 µm (corrected 2026-10-27). Under the old convention the spot centre pitch is 84.5 µm whereas Visium is designed for 100 µm: the nominal 112 / 128 µm public fields were actually ~132 / 151 µm, about 18% larger than the 128 µm used for TCGA training. HEST (metadata pixel size) and PDAC Visium HD (Space Ranger µm/px) are unaffected."
    question: "after re-extraction at the correct physical scale, does the local readout of the bulk model (S0) on public sections improve, i.e. is scale mismatch one reason for its poor transfer?"
    scope: "the 62 GEO sections re-extracted; the 4 HEST and 4 PDAC Visium HD sections keep their original features (scale already correct). Region indices, relative state, CAF-rich masks and neighbourhood definitions (in pixels) identical to A10/A12."
    geometry: "µm/px = 65 / spot_diameter_fullres / ratio (= old value × 65/55); centres, barcodes and image reading identical to A12. Preflight: for each GEO section, the median nearest-neighbour distance of in-tissue spots at the new µm/px must be 100 ± 2 µm; any failure stops and is reported (the pitch exceptions of three hires-only samples are outside this set; if any occur they are recorded as is without changing the scale). In addition, 8 tiles per source rebuilt at 112 µm with the old µm/px must have cosine with the original cache median >= 0.98 and minimum >= 0.90, showing that only µm/px changed."
    extraction: "UNI2-h offline read-only; each image read once and cropped at true 112 µm and true 128 µm, resized to 224 with the A12 preprocessing; features float16 stored separately, A9/A12 not overwritten."
    inference: "inference only, no training: S0 = the three A10 bulk weights; S1 = the three A9 pretrained weights; both scales inferred (S0 trained at 128 µm, S1 at 112 µm). S2 (leave-one-patient-out fine-tuning) is not retrained in this amendment; retraining would be proposed separately only if the primary result showed a substantial scale effect."
    statistics:
      unit: "patient; section ρ averaged equally within patient; two-sided Wilcoxon (approx, zero_method=wilcox); patient bootstrap 2000 percentile 95% CI, seed 20261021 (as A12)"
      primary: "21 public patients: median patient-paired Δρ of S0_true128 − S0_old128 (old = A12 S0_128, actually ~151 µm)"
      secondary: "S1_true112 − S1_old112 (old = A10/A12 S1_112, actually ~132 µm); across all 25 patients, S1_true112 − S0_true128 at each training scale and S1_true128 − S0_true128 at the same scale (HEST / PDAC Visium HD with original values); described by source / tissue"
    success: "primary: median Δρ > 0 with p < 0.05 → scale mismatch is one reason the bulk model transfers poorly. If not met, reported as 'this scale error has little effect on the local readout'. Regardless of the result, scale bars and µm/px of public sections in figures are corrected to the 65 µm convention (display only)."
    paths:
      a12: results/he/A12/2026-10-21_run01
      a10: results/he/A10/2026-10-21_run01
      a9: results/he/A9
      geo_raw: /Volumes/INTENSO_BIG/PDAC_spatial_public
      uni_cache: ~/.cache/huggingface/hub/models--MahmoodLab--UNI2-h
      output: results/he/A16
    load: "nice 19, 2 threads, batch 32, 0.05 s between batches, 15 s pause while load > 8 (as A12); chunked checkpoints for resuming; about 3–4 hours of extraction and minutes of inference."
    preflight_addendum_2026-10-28: "run01 preflight: old-scale reconstruction cosine 1.000 throughout; 59/62 sections had corrected pitch 99.6–100.1 µm; GSM8714178/79/80 (additional GSE274557 primaries, Pt-6 / Pt-8) had 96.0–96.2 µm, so the run stopped and was reported by rule. Decision (2026-10-28, option 1): all 62 sections extracted under the 65 µm convention, the 3 sections recorded as metadata pitch exceptions without changing the scale or dropping samples; the primary comparison without these 3 sections is reported as a sensitivity analysis. Primary endpoint and criterion unchanged; new run directory run02, run01 kept as the preflight record."
    spacing_exceptions: [GSM8714178, GSM8714179, GSM8714180]

  A17_cptac_and_d1_neighbourhood:   # 2026-10-28 request (first examine why CPTAC does not replicate, then the spatial neighbourhood in one PDAC Visium HD section, HDD1); exploratory, post hoc, changes no existing conclusion
    status: exploratory_2026-10-28
    part1_cptac_description:
