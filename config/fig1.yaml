      cell_types: "existing annotation HDD1_count/outs/results/cell_type.loupe_category.csv (GraphCluster names, 15 classes including Basal-like / Classical / Proliferating Malignant, iCAF, myCAF, TAMs (SPP1+), Acinar, ADM, Normal Ductal; Low_quality excluded from proportion denominators). No outcome inspected before reading; no re-annotation"
      context: "neighbourhood window per region = the region + its 8 neighbours (3×3, 450 µm): proportion of each annotated cell type; basal-like share of malignant cells (Basal-like /(Basal-like + Classical); missing if < 20 malignant cells); MPAS and Moffitt basal − classical of the malignant-cell pseudo-bulk in the window (gene sets from config/published_signatures.yaml, per-gene log1p CP10k z-scored across windows, then averaged). myCAF proportion as a positive control (expected to correlate positively with state)"
      statistics: "within CAF-rich regions, Spearman(rel, each neighbourhood metric), with Spearman(CAF amount = region pan-CAF log1p CP10k, each metric) as a comparator (state vs amount); spatial block bootstrap (4×4 regions = 600 µm blocks, 2000, seed 20261028) for 95% CI. Single section, exploratory, no pass criterion, not generalised to patient level."
