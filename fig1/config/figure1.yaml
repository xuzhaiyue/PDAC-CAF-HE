paths:
  panin: ${FIG1_DATA_ROOT}
  out_dir: SET_BY_RUN_DIR
datasets:
  CRA001160:
    h5ad: 02_intermediate/2026-09-16_six_cohort_input_bundle/standardized/CRA001160.h5ad
    lineage_col: lineage
    fibro_labels:
    - CAF
    patient_col: patient_id
    condition_col: condition
    condition_map:
      PDAC: PDAC_naive
      Normal: normal_pancreas
  GSE205013:
    h5ad: 02_intermediate/2026-09-16_six_cohort_input_bundle/standardized/GSE205013.h5ad
    lineage_col: lineage
    fibro_labels:
    - CAF
    patient_col: patient_id
    condition_col: condition
    condition_map:
      Naive: PDAC_naive
      Chemo: PDAC_chemo
  GSE278688:
    mtx_dir: 01_raw/GSE278688_family
    prefix: GSE278688_sc_
    lineage_col: all_celltype
    fibro_labels:
    - CAF
    - Stellate
    patient_col: patients
    condition_col: tissue
    condition_map:
      Tumor: PDAC_unknown_tx
      Adjacent_normal: adjacent_normal
    default_condition: non_tumor
    exclude_conditions:
    - non_tumor
discovery_conditions:
- PDAC_naive
- PDAC_unknown_tx
