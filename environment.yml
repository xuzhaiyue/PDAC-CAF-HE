name: hemorph
channels: [conda-forge]
dependencies:
  - python=3.11
  - numpy
  - scipy
  - pandas
  - pyarrow
  - scikit-learn
  - scanpy
  - anndata
  - h5py
  - shapely>=2
  - opencv
  - tifffile
  - imagecodecs
  - openslide-python
  - pyyaml
  - matplotlib
  - leidenalg
  - python-igraph
  - pillow
  # torch also from conda-forge: the pip torch ships its own libomp, which clashes with conda sklearn/opencv (OMP Error #15)
  - pytorch
  - torchvision
  - timm>=1.0
  - huggingface_hub
